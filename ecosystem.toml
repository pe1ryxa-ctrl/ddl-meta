hil = false

[[projects]]
dir = "SRC"
tag = "SRC"
ssot = "VRX"
title = "SRC — Smart VRX Control (ESP32-C3)"
target = "ESP32-C3"
rules = "R2/prod-деплой лише після фізичної перевірки Gans"
hil = false

[[projects]]
dir = "DAI"
tag = "DAI"
ssot = "DAI"
title = "DAI — Danger AI (knowledge assistant)"
target = "macOS, Ollama; Gemini API (платно)"
