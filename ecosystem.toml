# ecosystem.toml — опис екосистеми DDL для l2l1-kit/sync.py (корінь = місце цього файлу)
name = "Danger Drones Lab (DDL)"
tags_reserved = ["KSRV", "KWS", "KSIM", "KNODE", "KQGC"]
table_note = "Спільні скіли: `Shared_Skills/skills/*` (ADLP, ddl-firmware-builder, ddl-firmware-deployer). Архів старої системи: `_archive/`. Гілки: Server `main`, SRC `v1.2-stable-dev`/`master`, STC `main`."

[[projects]]
dir = "Server"
tag = "DDL"
ssot = "DDL"
