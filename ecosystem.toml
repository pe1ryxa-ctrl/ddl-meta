target = "VPS, CI/CD через GitHub Actions"
rules = "i18n-аудит, Redis DB≠0, Alembic bool defaults; деплой робить CI після push у main"
hil = false

[[projects]]
dir = "STC"
tag = "STC"
ssot = "STC"
